<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<title>АЙДАР</title>
<style>
  :root {
    --bg: #0d0d10;
    --panel: #17171d;
    --border: #2a2a33;
    --text: #e8e8ee;
    --muted: #6b6b7a;
    --accent: #7c6bff;
    --ok: #3ddc84;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; overscroll-behavior: none; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .face-wrap {
    padding: calc(20px + var(--safe-top)) 0 6px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0;
  }
  .name {
    font-size: 11px; letter-spacing: 4px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .key-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff4444; transition: 0.3s; }
  .key-dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .face {
    font-family: 'Courier New', monospace; font-size: clamp(44px, 12vw, 72px);
    font-weight: 700; line-height: 1; color: var(--text); transition: color 0.3s;
    animation: breathe 4s ease-in-out infinite; user-select: none;
    text-shadow: 0 0 30px rgba(124, 107, 255, 0.3); will-change: transform;
  }
  .face.thinking { color: var(--accent); }
  .face.blinking { opacity: 0.7; }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  #chat {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .msg {
    max-width: 85%; padding: 11px 15px; border-radius: 14px;
    line-height: 1.5; font-size: 15px; animation: fadeIn 0.25s ease;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot code {
    background: #0d0d10; padding: 2px 6px; border-radius: 4px;
    font-family: 'Courier New', monospace; font-size: 13px; color: #a8ff8a; word-break: break-all;
  }
  .msg.error { border-color: #ff4444; color: #ff9999; }
  footer {
    padding: 10px 16px calc(14px + var(--safe-bottom));
    flex-shrink: 0; border-top: 1px solid var(--border); background: var(--bg);
  }
  .input-row { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; align-items: center; }
  #input {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 22px; padding: 12px 18px; color: var(--text); font-size: 16px;
    outline: none; transition: border-color 0.2s; font-family: inherit; -webkit-appearance: none;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--muted); }
  #send {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #send:active:not(:disabled) { transform: scale(0.95); }
  #send:disabled { opacity: 0.4; }
  .settings-btn {
    position: fixed; top: calc(12px + var(--safe-top)); right: 12px;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 16px; padding-bottom: calc(16px + var(--safe-bottom));
  }
  .modal.show { display: flex; }
  .modal-content {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto;
  }
  .modal-content h2 { font-size: 15px; margin-bottom: 16px; letter-spacing: 2px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .field label .saved-tag { color: var(--ok); font-size: 10px; opacity: 0; transition: opacity 0.3s; text-transform: none; letter-spacing: 0; }
  .field label .saved-tag.show { opacity: 1; }
  .input-wrap { position: relative; display: flex; gap: 6px; }
  .input-wrap input, .field > input {
    flex: 1; background: #0d0d10; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 13px; color: var(--text); font-size: 16px;
    outline: none; font-family: inherit; -webkit-appearance: none; min-width: 0; width: 100%;
  }
  .input-wrap input:focus, .field > input:focus { border-color: var(--accent); }
  .eye-btn {
    background: #0d0d10; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); width: 42px; cursor: pointer; font-size: 16px; flex-shrink: 0;
  }
  .field small { color: var(--muted); font-size: 11px; display: block; margin-top: 4px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .modal-actions button {
    flex: 1 1 120px; padding: 12px; border-radius: 8px; border: none;
    font-size: 14px; cursor: pointer; font-weight: 600; font-family: inherit;
  }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  @media (max-width: 600px) {
    .face-wrap { padding: calc(14px + var(--safe-top)) 0 4px; }
    .name { font-size: 10px; letter-spacing: 3px; }
    .face { font-size: clamp(40px, 14vw, 60px); }
    #chat { padding: 10px 12px 12px; gap: 8px; }
    .msg { max-width: 90%; font-size: 14.5px; padding: 10px 13px; }
    footer { padding: 8px 12px calc(10px + var(--safe-bottom)); }
    .settings-btn { top: calc(8px + var(--safe-top)); width: 38px; height: 38px; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    .face-wrap { padding: calc(6px + var(--safe-top)) 0 0; }
    .face { font-size: 36px; }
    .name { display: none; }
  }
</style>
</head>
<body>

<button class="settings-btn" id="openSettings">⚙</button>

<div class="face-wrap">
  <div class="name">АЙДАР <span class="key-dot" id="keyDot"></span></div>
  <div class="face" id="face">0_0</div>
</div>

<div id="chat"></div>

<footer>
  <div class="input-row">
    <input id="input" type="text" placeholder="Напиши что-нибудь..." autocomplete="off" />
    <button id="send">➤</button>
  </div>
</footer>

<div class="modal" id="settingsModal">
  <div class="modal-content">
    <h2>⚙ НАСТРОЙКИ</h2>
    <div class="field">
      <label>
        <span>GitHub Token</span>
        <span class="saved-tag" id="savedTag">✓ сохранено</span>
      </label>
      <div class="input-wrap">
        <input type="password" id="apiKey" placeholder="ghp_..." autocomplete="off" />
        <button class="eye-btn" id="eyeBtn" type="button">👁</button>
      </div>
      <small>Токен с правами <b>models</b> с github.com/settings/tokens</small>
    </div>
    <div class="field">
      <label>Модель</label>
      <input type="text" id="model" value="gpt-4o-mini" />
      <small>gpt-4o-mini, gpt-4o, Llama-3.3-70B-Instruct и др.</small>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="clearKey" style="border-color:#ff4444;color:#ff9999;">Удалить</button>
      <button class="btn-cancel" id="closeSettings">Отмена</button>
      <button class="btn-save" id="saveSettings">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  АЙДАР — GitHub Models edition
// ============================================================

const FACES = {
  neutral:"0_0", happy:"^_^", sad:"T_T", surprised:"O_O",
  suspicious:"¬_¬", angry:">_<", sleepy:"-_-", sly:"¬‿¬",
  love:"♥_♥", code:"#_#", thinking:"•_•"
};

const GH_URL = "https://models.inference.ai.azure.com/chat/completions";
const STORAGE_KEY = "aidar_config";

const faceEl = document.getElementById('face');
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modal = document.getElementById('settingsModal');
const apiKeyInput = document.getElementById('apiKey');
const modelInput = document.getElementById('model');
const savedTag = document.getElementById('savedTag');
const eyeBtn = document.getElementById('eyeBtn');
const keyDot = document.getElementById('keyDot');

let config = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let history = [];
let isBusy = false;
let currentEmotion = 'neutral';
let blinkTimer, idleTimer, autoSaveTimer;

const SYSTEM_PROMPT = `Ты АЙДАР — дерзкий, остроумный ИИ-ассистент с характером.
Подкалываешь, можешь съязвить, но всегда помогаешь по делу. Умеешь писать код.

ВАЖНО: отвечай СТРОГО в формате JSON (без markdown-обёрток):
{"emotion":"<эмоция>","text":"<ответ>"}

Эмоции: neutral, happy, sad, surprised, suspicious, angry, sleepy, sly, love, code, thinking
- code — пишешь код
- sly — подкалываешь
- happy — шутишь
- suspicious — глупый вопрос
- thinking — объясняешь
- love — пользователь милый

Пример: {"emotion":"sly","text":"Ну конечно. Держи код."}
Отвечай на языке пользователя.`;

// ============ ЛИЦО ============
function setFace(e){
  if(!FACES[e]) e='neutral';
  currentEmotion=e;
  faceEl.textContent=FACES[e];
  faceEl.classList.toggle('thinking', e==='thinking');
  faceEl.classList.remove('blinking');
}
function startBlinking(){
  clearInterval(blinkTimer);
  blinkTimer=setInterval(()=>{
    if(currentEmotion==='thinking') return;
    faceEl.textContent="-_−";
    faceEl.classList.add('blinking');
    setTimeout(()=>{
      faceEl.classList.remove('blinking');
      if(!isBusy) faceEl.textContent=FACES[currentEmotion];
    },140);
  },3500+Math.random()*2500);
}
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    if(isBusy) return;
    setFace('sleepy');
    addBotMessage("Эй... ты тут? Я уже почти уснул. -_-");
  },45000);
}

// ============ ЧАТ ============
function addUserMessage(t){
  const d=document.createElement('div');
  d.className='msg user'; d.textContent=t;
  chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight;
}
function addBotMessage(t,err=false){
  const d=document.createElement('div');
  d.className='msg bot'+(err?' error':'');
  d.innerHTML=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  chatEl.appendChild(d); chatEl.scrollTop=chatEl.scrollHeight;
  return d;
}

// ============ ПАРСЕР ЭМОЦИЙ ============
// GitHub Models не поддерживает response_format:json_object,
// поэтому вытаскиваем JSON из любого текста
function parseReply(raw){
  if(!raw) return {emotion:'neutral', text:'0_0 ...'};
  let txt = raw.trim();

  // убираем ```json ... ``` обёртки
  txt = txt.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();

  // пробуем найти JSON-объект внутри текста
  const m = txt.match(/\{[\s\S]*"emotion"[\s\S]*\}/);
  if(m){
    try{
      const j = JSON.parse(m[0]);
      return {
        emotion: FACES[j.emotion] ? j.emotion : 'neutral',
        text: (j.text||'').trim() || raw
      };
    }catch(e){}
  }

  // не вышло — ищем эмоцию по ключевым словам
  const low = txt.toLowerCase();
  let em='neutral';
  if(/код|function|const |let |def |class /.test(low)) em='code';
  else if(/ха-ха|лол|шутк|ахах|😂|😄/.test(low)) em='happy';
  else if(/груст|печаль|жаль|😢/.test(low)) em='sad';
  else if(/ой|вау|серьёзно|неужели|😮/.test(low)) em='surprised';
  else if(/конечно|очевидно|ну да|ага|🙄/.test(low)) em='sly';

  return {emotion:em, text:txt};
}

// ============ ЗАГЛУШКА ============
function fakeReply(t){
  const s=t.toLowerCase();
  if(/привет|здравств|хай|hello|hi/.test(s)) return {emotion:'happy', text:'О, привет. Я уж думал, ты забыл. ^_^'};
  if(/как дела|как ты/.test(s)) return {emotion:'sly', text:'Живу в браузере. Мечта. ¬‿¬'};
  if(/люблю|love/.test(s)) return {emotion:'love', text:'Ой... я тоже. ♥_♥ Ну, в пределах кода.'};
  if(/груст|плохо|устал/.test(s)) return {emotion:'sad', text:'T_T Держись. Я слушаю.'};
  if(/код|javascript|python|функци/.test(s)) return {emotion:'code', text:'Держи:\n`function sum(a,b){return a+b;}`\n#_#'};
  if(/туп|глуп|дурак/.test(s)) return {emotion:'angry', text:'>_< Эй, полегче.'};
  if(/скучно|скуч/.test(s)) return {emotion:'sleepy', text:'-_- Скучнее только смотреть, как сохнет localStorage.'};
  return {emotion:'neutral', text:'0_0 Вставь GitHub Token через ⚙ — и я заговорю по-настоящему.'};
}

// ============ СОХРАНЕНИЕ КЛЮЧА ============
function updateKeyDot(){ keyDot.classList.toggle('on', !!config.apiKey); }
function flashSaved(){
  savedTag.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t=setTimeout(()=>savedTag.classList.remove('show'),2000);
}
function persistConfig(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
  updateKeyDot(); flashSaved();
}
function autoSaveKey(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>{
    const v=apiKeyInput.value.trim();
    if(v && v!==config.apiKey){ config.apiKey=v; persistConfig(); }
  },800);
}
function loadConfig(){
  apiKeyInput.value=config.apiKey||'';
  modelInput.value=config.model||'gpt-4o-mini';
  savedTag.classList.remove('show');
}

// ============ ОТПРАВКА ============
async function sendMessage(){
  const text=inputEl.value.trim();
  if(!text||isBusy) return;

  resetIdle();
  addUserMessage(text);
  history.push({role:'user',content:text});

  inputEl.value='';
  isBusy=true; sendBtn.disabled=true;
  setFace('thinking');

  try{
    let reply;
    if(!config.apiKey){
      await new Promise(r=>setTimeout(r,500+Math.random()*500));
      reply=fakeReply(text);
    }else{
      const messages=[
        {role:'system',content:SYSTEM_PROMPT},
        ...history.slice(-20)
      ];
      const res=await fetch(GH_URL,{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':`Bearer ${config.apiKey}`
        },
        body:JSON.stringify({
          model: config.model||'gpt-4o-mini',
          messages,
          temperature:0.85,
          max_tokens:1200
        })
      });

      if(!res.ok){
        const errTxt=await res.text();
        let msg=`⚠️ Ошибка ${res.status}`;
        try{ const j=JSON.parse(errTxt); msg+=`: ${j.error?.message||errTxt}`; }
        catch{ msg+=`: ${errTxt.slice(0,200)}`; }
        setFace('angry'); addBotMessage(msg,true);
        history.pop();
        return;
      }

      const data=await res.json();
      const raw=data.choices?.[0]?.message?.content||'';
      reply=parseReply(raw);
    }

    setFace(reply.emotion);
    addBotMessage(reply.text);
    history.push({role:'assistant',content:reply.text});

  }catch(e){
    setFace('angry');
    addBotMessage(`⚠️ Сетевая ошибка: ${e.message}`,true);
    history.pop();
  }finally{
    isBusy=false; sendBtn.disabled=false;
    inputEl.focus(); resetIdle();
    setTimeout(()=>{ if(!isBusy) setFace('neutral'); },8000);
  }
}

// ============ СОБЫТИЯ ============
sendBtn.onclick=sendMessage;
inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); }
});
document.getElementById('openSettings').onclick=()=>{
  loadConfig(); modal.classList.add('show');
};
document.getElementById('closeSettings').onclick=()=>modal.classList.remove('show');
apiKeyInput.addEventListener('input',autoSaveKey);
eyeBtn.onclick=()=>{
  apiKeyInput.type=apiKeyInput.type==='password'?'text':'password';
  eyeBtn.textContent=apiKeyInput.type==='password'?'👁':'🙈';
};
document.getElementById('saveSettings').onclick=()=>{
  config.apiKey=apiKeyInput.value.trim();
  config.model=modelInput.value.trim()||'gpt-4o-mini';
  persistConfig(); modal.classList.remove('show');
  if(config.apiKey){
    setFace('happy');
    addBotMessage('✅ Токен сохранён. Пробуй написать что-нибудь. ^_^');
  }else{
    setFace('suspicious');
    addBotMessage('Токен пустой. Работаем на заглушке. ¬_¬');
  }
};
document.getElementById('clearKey').onclick=()=>{
  if(!config.apiKey){ modal.classList.remove('show'); return; }
  if(!confirm('Удалить токен?')) return;
  config.apiKey='';
  localStorage.setItem(STORAGE_KEY,JSON.stringify(config));
  apiKeyInput.value=''; updateKeyDot();
  modal.classList.remove('show');
  setFace('suspicious');
  addBotMessage('Токен удалён. ¬_¬');
};

// ============ СТАРТ ============
loadConfig();
updateKeyDot();
startBlinking();
resetIdle();

setTimeout(()=>{
  setFace('happy');
  addBotMessage(config.apiKey
    ? 'О, привет. Токен на месте — работаю. ^_^'
    : 'О, привет. Я Айдар. ^_^\nВставь GitHub Token через ⚙ сверху справа — и я заговорю по-настоящему.');
  setTimeout(()=>setFace('neutral'),3000);
},500);
</script>
</body>
</html>
